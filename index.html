<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gwangalli Memories - 뉴스 스크랩</title>

  <!-- 브라우저 탭 옆에 뜨는 동그란 프로필 사진 로고 (파비콘) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <clipPath id='circleView'>
        <circle cx='50' cy='50' r='50'/>
      </clipPath>
      <image href='profile.png' width='100' height='100' preserveAspectRatio='xMidYMid slice' clip-path='url(%23circleView)' />
    </svg>
  ">

  <!-- 스타일시트 디자인 -->
  <style>
    :root {
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --sub-text: #777777;
      --accent-color: #ff6b6b;
      --border-color: #eeeeee;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    .logo-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 500;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: #333;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #555;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background-color: #d0d0d0;
    }

    /* 스크랩 카드 리스트 디자인 */
    .scrap-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .scrap-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scrap-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-color);
      text-decoration: none;
    }

    .scrap-title:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .scrap-desc {
      font-size: 0.95rem;
      color: var(--sub-text);
    }

    .scrap-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    .delete-btn {
      background: none;
      color: #ff4d4d;
      padding: 4px 8px;
      font-size: 0.85rem;
    }

    .delete-btn:hover {
      background-color: #ffe6e6;
      border-radius: 4px;
    }

    /* 모달창 스타일 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input, .modal-content textarea {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="logo-area">
      <!-- 사이트 내부에 노출되는 원형 로고 이미지 -->
      <img src="profile.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/45'">
      <span class="logo-title">Gwangalli Memories</span>
    </div>
    <nav>
      <a href="#">HOME</a>
      <a href="#">GALLERY</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <!-- 메인 컨테이너 -->
  <div class="container">
    <div class="action-bar">
      <h2>📌 뉴스 스크랩 보관함</h2>
      <div class="btn-group">
        <button class="btn-secondary" onclick="exportData()">[JSON 백업]</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">[불러오기]</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        <button class="btn-primary" onclick="openModal()">+ 새 뉴스 스크랩</button>
      </div>
    </div>

    <!-- 스크랩 목록 영역 -->
    <div id="scrapList" class="scrap-list">
      <!-- 자바스크립트로 데이터가 동적으로 채워집니다 -->
    </div>
  </div>

  <!-- 스크랩 추가 모달창 -->
  <div id="scrapModal" class="modal">
    <div class="modal-content">
      <h3>새 뉴스 스크랩 추가</h3>
      <input type="text" id="newsTitle" placeholder="뉴스 제목을 입력하세요">
      <input type="text" id="newsUrl" placeholder="뉴스 링크 (URL)를 입력하세요">
      <textarea id="newsDesc" rows="3" placeholder="간단한 메모나 요약을 입력하세요"></textarea>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn-primary" onclick="saveScrap()">저장</button>
      </div>
    </div>
  </div>

  <!-- 자바스크립트 기능 로직 -->
  <script>
    // 로컬 스토리지에서 데이터 불러오기 또는 기본값 설정
    let scraps = JSON.parse(localStorage.getItem('gwangalli_scraps')) || [
      { id: 1, title: '광안리 해수욕장 미디어아트 상설 전시 안내', url: '#', desc: '매주 주말 밤 멋진 드론쇼와 미디어아트가 펼쳐집니다.', date: '2026-06-01' }
    ];

    function renderScraps() {
      const listEl = document.getElementById('scrapList');
      listEl.innerHTML = '';

      if (scraps.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; color:#777; padding: 40px 0;">저장된 스크랩이 없습니다. 우측 상단 버튼을 눌러 추가해보세요!</p>';
        return;
      }

      scraps.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'scrap-card';
        card.innerHTML = `
          <a href="${item.url}" target="_blank" class="scrap-title">${item.title}</a>
          <div class="scrap-desc">${item.desc || '작성된 메모가 없습니다.'}</div>
          <div class="scrap-footer">
            <span>${item.date}</span>
            <button class="delete-btn" onclick="deleteScrap(${index})">삭제</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function openModal() {
      document.getElementById('scrapModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('scrapModal').style.display = 'none';
      document.getElementById('newsTitle').value = '';
      document.getElementById('newsUrl').value = '';
      document.getElementById('newsDesc').value = '';
    }

    function saveScrap() {
      const title = document.getElementById('newsTitle').value;
      const url = document.getElementById('newsUrl').value || '#';
      const desc = document.getElementById('newsDesc').value;

      if (!title) {
        alert('뉴스 제목을 입력해주세요!');
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      scraps.unshift({ title, url, desc, date: today });

      localStorage.setItem('gwangalli_scraps', JSON.stringify(scraps));
      renderScraps();
      closeModal();
    }

    function deleteScrap(index) {
      if (confirm('정말 이 스크랩을 삭제하시겠습니까?')) {
        scraps.splice(index, 1);
        localStorage.setItem('gwangalli_scraps', JSON.stringify(scraps));
        renderScraps();
      }
    }

    // JSON 백업 기능[cite: 8]
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scraps));
      const downloadAnchor = document.createElement('a');
      const dateStr = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `news_scrap_backup_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // JSON 불러오기 기능[cite: 8, 9]
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            scraps = importedData;
            localStorage.setItem('gwangalli_scraps', JSON.stringify(scraps));
            renderScraps();
            alert('데이터를 성공적으로 불러왔습니다!');
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    // 페이지 로드 시 실행
    renderScraps();
  </script>
</body>
</html>
