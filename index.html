<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mugmnghan.k</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Gowun+Batang&family=Inter:wght@200;300;400;500&family=Montserrat:wght@300;400&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@200;300;400&family=Oswald:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #F8F8F9;
            --text-color: #1A1A1A;
            --sub-color: #787878;
            --line-color: #ECECEC;
            --font-title: 'Cormorant Garamond', 'Noto Serif KR', serif;
            --font-body: 'Noto Serif KR', 'Cormorant Garamond', serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        /* 복사, 드래그, 우클릭 전면 금지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            font-size: 13px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
        }

        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font-family: inherit; border: none; outline: none; background: none; }

        body.admin-mode input, 
        body.admin-mode textarea, 
        body.admin-mode [contenteditable="true"] {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        /* Header Layout */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(248, 248, 249, 0.94);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: none;
            padding: 28px 45px 12px 45px;
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            cursor: pointer;
            line-height: 1;
        }

        .header-socials {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.25;
            transition: opacity 0.3s ease;
        }

        .header-socials:hover { opacity: 0.8; }

        .social-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        /* 메인 화면에서는 숨겨져 있다가 호버/클릭 시 드롭다운되는 메뉴 */
        nav {
            margin-top: 22px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, margin-top 0.4s ease;
        }

        header:hover nav, nav.open, body:not(.page-main) nav {
            max-height: 50px;
            opacity: 1;
        }

        nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
            align-items: center;
        }

        nav a {
            font-family: var(--font-title);
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--sub-color);
            opacity: 0.4;
            transition: all 0.3s ease;
            cursor: pointer;
            line-height: 1;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
        }

        nav a:hover { opacity: 0.8; }

        nav a.active {
            color: var(--text-color);
            opacity: 1;
            font-weight: 500;
            border-bottom-color: var(--text-color);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 0 20px;
            min-height: calc(100vh - 180px);
        }

        section { display: none; animation: fadeIn 0.4s ease forwards; }
        section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MAIN Page */
        .main-hero-wrapper {
            width: 100%;
            height: 68vh;
            max-height: 620px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.6s ease;
            cursor: pointer;
        }

        .main-hero-img:hover { filter: grayscale(0%); }

        /* GREETING Page */
        .greeting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
            margin-top: 10px;
        }

        .greeting-card {
            overflow: hidden;
            background: #EEEEEE;
            cursor: pointer;
        }

        .greeting-card img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.5s ease, transform 0.5s ease;
            display: block;
        }

        .greeting-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.02);
        }

        /* LOG Section */
        .section-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 25px;
        }

        .category-filter-bar {
            display: flex;
            gap: 28px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            align-items: center;
            padding-left: 2px;
        }

        .filter-btn {
            font-family: var(--font-title);
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-color);
            opacity: 0.35;
            cursor: pointer;
            padding: 2px 0;
            border: none;
            border-bottom: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .filter-btn:hover { opacity: 0.7; }

        .filter-btn.active {
            opacity: 1;
            font-weight: 500;
            border-bottom-color: var(--text-color);
        }

        .btn-write {
            display: none;
            padding: 6px 16px;
            background: var(--text-color);
            color: #FFFFFF;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        body.admin-mode .btn-write { display: inline-block; }

        /* Album View Grid */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 35px;
        }

        .album-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .album-card:hover { transform: translateY(-3px); }

        .album-img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            filter: grayscale(100%);
            background-color: #EEEEEE;
            margin-bottom: 12px;
            transition: filter 0.4s ease;
        }
        .album-card:hover .album-img { filter: grayscale(0%); }

        .album-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 4px;
        }

        .album-date {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            color: var(--sub-color);
        }

        .album-title-right {
            font-family: var(--font-title);
            font-size: 1.05rem;
            font-weight: 400;
            text-align: right;
        }

        /* Detail Log View Layout */
        .log-detail-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 45px;
            align-items: start;
        }

        .sidebar-container {
            border-right: none !important;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-category-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-cat-title {
            font-family: var(--font-title);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .sidebar-post-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 10px;
        }

        .sidebar-post-item {
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.82rem;
            color: var(--sub-color);
            transition: color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-post-item:hover, .sidebar-post-item.active {
            color: var(--text-color);
            font-weight: 500;
        }

        /* Single Article View */
        .single-article {
            background: transparent;
            padding: 0;
            position: relative;
        }

        .back-btn-row {
            margin-bottom: 20px;
        }

        .btn-back {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--sub-color);
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .btn-back:hover { color: var(--text-color); }

        .article-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: none !important;
            flex-wrap: wrap;
            gap: 15px;
        }

        .single-title {
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 400;
            line-height: 1.2;
        }

        .single-meta-right {
            display: flex;
            gap: 12px;
            align-items: center;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--sub-color);
        }

        .single-category-text {
            font-family: var(--font-title);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: none;
            padding: 0;
            color: var(--sub-color);
        }

        .single-body {
            font-size: 0.92rem;
            line-height: 1.85;
            color: #222222;
            word-break: keep-all;
        }

        .single-body img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            display: block;
            cursor: pointer;
        }

        .article-actions {
            margin-top: 40px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-action {
            display: none;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            padding: 5px 14px;
            border: 1px solid var(--line-color);
            cursor: pointer;
            background: #FFFFFF;
        }

        body.admin-mode .btn-action { display: inline-block; }
        .btn-action:hover { border-color: var(--text-color); }
        .btn-action.delete { color: #D32F2F; border-color: #FFCDD2; }

        /* Fullscreen Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.94);
            z-index: 500;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox-modal.active { display: flex; }
        .lightbox-img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        /* Editor Modal */
        .editor-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .editor-modal.active { display: flex; }

        .editor-box {
            background: #FFFFFF;
            width: 92%;
            max-width: 820px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: #F5F5F7;
            border: 1px solid var(--line-color);
            margin-bottom: 12px;
            align-items: center;
        }

        .editor-toolbar select, .editor-toolbar button, .editor-toolbar label, .editor-toolbar input[type="color"] {
            padding: 4px 8px;
            font-size: 0.78rem;
            background: #FFFFFF;
            border: 1px solid #DDD;
            cursor: pointer;
            height: 30px;
            display: inline-flex;
            align-items: center;
        }

        .editor-content {
            min-height: 280px;
            border: 1px solid var(--line-color);
            padding: 15px;
            outline: none;
            line-height: 1.85;
            font-size: 14px;
            background: #FAFAFA;
        }

        .editor-content:focus { background: #FFFFFF; border-color: var(--text-color); }
        .editor-form-group { margin-bottom: 14px; }
        .editor-form-group label {
            display: block;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            color: var(--sub-color);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .editor-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line-color);
            font-size: 0.85rem;
        }

        /* Admin Bottom Bar */
        .admin-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: #888888;
            cursor: pointer;
            z-index: 200;
            padding: 6px 14px;
            background: #FFFFFF;
            border: 1px solid var(--line-color);
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .admin-badge {
            display: none;
            background: #000000;
            color: #FFFFFF;
            font-family: var(--font-sans);
            font-size: 0.62rem;
            padding: 2px 6px;
            letter-spacing: 0.1em;
            margin-left: 8px;
            vertical-align: middle;
        }

        body.admin-mode .admin-badge { display: inline-block; }

        .admin-edit-box {
            display: none;
            background: #FFFFFF;
            border: 1px solid var(--text-color);
            padding: 20px;
            margin-bottom: 25px;
        }

        body.admin-mode .admin-edit-box { display: block; }

        /* Footer */
        footer {
            max-width: 1100px;
            margin: 70px auto 0 auto;
            padding: 25px 20px 0 20px;
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copyright {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            color: var(--sub-color);
        }

        @media (max-width: 768px) {
            header { padding: 18px 20px 10px 20px; }
            .log-detail-layout { grid-template-columns: 1fr; }
            .sidebar-container { border-right: none; border-bottom: 1px solid var(--line-color); padding-bottom: 15px; }
            footer { flex-direction: column; gap: 12px; text-align: center; }
            .article-header-row { flex-direction: column; align-items: flex-start; gap: 5px; }
        }
    </style>
</head>
<body class="page-main">

    <!-- Header Navigation -->
    <header id="mainHeader">
        <div class="header-top-row">
            <div class="logo" onclick="navigateTo('main')">
                mugmnghan.k <span class="admin-badge">ADMIN MODE</span>
            </div>
            
            <div class="header-socials">
                <a href="https://www.instagram.com/mugunghan.k" target="_blank" class="social-icon-btn" title="Instagram">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="https://www.threads.com/@mugunghan.k" target="_blank" class="social-icon-btn" title="Threads">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 12c0 2.2-1.8 4-4 4s-4-1.8-4-4 1.8-4 4-4 4 1.8 4 4z"></path><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10c0-2.8-1.1-5.3-3-7.1"></path></svg>
                </a>
            </div>
        </div>

        <nav id="mainNav">
            <ul>
                <li><a onclick="navigateTo('greeting')" id="nav-greeting">GREETING</a></li>
                <li><a onclick="navigateTo('log')" id="nav-log">LOG</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- 1. MAIN Page -->
        <section id="main" class="active">
            <div class="admin-edit-box">
                <h3 style="font-family: var(--font-sans); font-size: 0.8rem; margin-bottom: 12px;">[ADMIN] 메인 비주얼 이미지 교체</h3>
                <div class="editor-form-group">
                    <label>메인 사진 (URL 입력 또는 파일 선택)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="url" id="editMainImg" class="editor-input" placeholder="https://">
                        <label class="btn-action" style="display:inline-block; white-space:nowrap; cursor:pointer;">
                            파일 선택
                            <input type="file" accept="image/*" style="display:none;" onchange="uploadMainImgFile(event)">
                        </label>
                    </div>
                </div>
                <button class="btn-write" style="display:inline-block; margin-top:10px;" onclick="saveMainVisual()">저장하기</button>
            </div>

            <div class="main-hero-wrapper">
                <img id="displayMainImg" src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1200&q=80" alt="Main Visual" class="main-hero-img" onclick="openLightbox(this.src)">
            </div>
        </section>

        <!-- 2. GREETING Section -->
        <section id="greeting">
            <div class="admin-edit-box">
                <h3 style="font-family: var(--font-sans); font-size: 0.8rem; margin-bottom: 12px;">[ADMIN] GREETING 사진첩 이미지 관리</h3>
                <div class="editor-form-group">
                    <label>새 사진 추가 (URL 또는 파일)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="url" id="newGreetingImgUrl" class="editor-input" placeholder="https://">
                        <label class="btn-action" style="display:inline-block; white-space:nowrap; cursor:pointer;">
                            파일 직접 업로드
                            <input type="file" accept="image/*" style="display:none;" onchange="uploadGreetingImgFile(event)">
                        </label>
                    </div>
                </div>
                <button class="btn-write" style="display:inline-block; margin-top:10px;" onclick="addGreetingImage()">사진첩에 사진 추가</button>
                <div style="margin-top:15px; padding-top:10px; border-top: 1px dashed var(--line-color); display:flex; gap:10px;">
                    <button class="btn-action" style="display:inline-block;" onclick="exportDataJSON()">📦 백업 다운로드 (.json)</button>
                    <button class="btn-action" style="display:inline-block;" onclick="document.getElementById('importFile').click()">📥 백업 복원 (.json)</button>
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importDataJSON(event)">
                </div>
            </div>

            <div class="greeting-grid" id="greetingGrid"></div>
        </section>

        <!-- 3. LOG Section -->
        <section id="log">
            <div class="section-header">
                <button class="btn-write" onclick="openEditorModal()">+ WRITE NEW LOG</button>
            </div>

            <div class="category-filter-bar" id="categoryFilterBar">
                <button class="filter-btn active" onclick="filterCategory('ALL')">ALL</button>
                <button class="filter-btn" onclick="filterCategory('PLACES')">PLACES</button>
                <button class="filter-btn" onclick="filterCategory('WISHES')">WISHES</button>
                <button class="filter-btn" onclick="filterCategory('VOICES')">VOICES</button>
            </div>

            <div id="albumView" class="album-grid"></div>

            <div id="detailView" class="log-detail-layout" style="display: none;">
                <div class="sidebar-container" id="sidebarContainer"></div>
                
                <div class="single-article">
                    <div class="back-btn-row">
                        <span class="btn-back" onclick="showAlbumView()">← BACK TO LIST</span>
                    </div>

                    <div class="article-header-row">
                        <h1 class="single-title" id="singleTitle"></h1>
                        <div class="single-meta-right">
                            <span id="singleDate"></span>
                            <span class="single-category-text" id="singleCategory"></span>
                        </div>
                    </div>

                    <div class="single-body" id="singleBody"></div>
                    
                    <div class="article-actions">
                        <button class="btn-action" onclick="editCurrentLog()">수정</button>
                        <button class="btn-action delete" onclick="deleteCurrentLog()">삭제</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <div class="copyright">
            &copy; 2026 mugmnghan.k. All rights reserved.
        </div>
    </footer>

    <!-- Fullscreen Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
        <img src="" id="lightboxImg" class="lightbox-img" alt="Enlarged View">
    </div>

    <!-- Rich Text Editor Modal -->
    <div class="editor-modal" id="editorModal">
        <div class="editor-box">
            <h2 style="font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 18px;" id="modalHeading">새 기록 작성</h2>
            
            <div style="display: flex; gap: 12px; margin-bottom: 14px;">

        // 이미지 자동 압축 헬퍼 함수
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

            const content = document.getElementById('editorContent').innerHTML;

            if (!title.trim()) { alert("제목을 입력해주세요."); return; }

            try {
                if (editingLogId) {
                    const { error } = await supabaseClient
                        .from('posts')
                        .update({ title, titleSize, category, content })
                        .eq('id', editingLogId);
                    if (error) throw error;
                    currentLogId = editingLogId;
                } else {
                    const newLog = {
                        id: Date.now(),
                        title,
                        titleSize,
                        category,
                        content,
                        date: new Date().toISOString().split('T')[0].replace(/-/g, '.')

                    const { error } = await supabaseClient.from('posts').insert([newLog]);
                    if (error) throw error;
                    currentLogId = newLog.id;

                closeEditorModal();

                if (document.getElementById('detailView').style.display !== 'none') {
                    await openDetailView(currentLogId, false);

                    showAlbumView(false);

                downloadAnchor.setAttribute("download", `mugmnghan_backup_${new Date().toISOString().split('T')[0]}.json`);

        async function importDataJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.posts && Array.isArray(imported.posts)) {
                        for (let post of imported.posts) {
                            await supabaseClient.from('posts').upsert([post]);
                        }
                        await loadMainVisual();
                        await renderGreetingPhotos();
                        await renderAlbumView();
                        alert("데이터가 Supabase에 성공적으로 복원되었습니다.");
                    } else {
                        alert("올바르지 않은 백업 파일 형식입니다.");
                    }
                } catch (err) {
                    alert("파일을 읽는 도중 오류가 발생했습니다.");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
